version: '3.8'

services:
  service1:
    build: ./service1
    ports:
      - "3000:3000"
    networks:
      - app-network

  service2:
    build: ./service2
    ports:
      - "3001:3001"
    networks:
      - app-network

  service3:
    build: ./service3
    ports:
      - "3003:3003"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
